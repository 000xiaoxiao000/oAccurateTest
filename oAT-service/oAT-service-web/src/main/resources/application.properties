server.port=8899

server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8

# \u6700\u5927\u6587\u4EF6\u5927\u5C0F
spring.servlet.multipart.max-file-size=2048MB
# \u6700\u5927\u8BF7\u6C42\u5927\u5C0F
spring.servlet.multipart.max-request-size=2048MB

server.max-http-header-size=102400

#\u65E5\u5FD7\u7B49\u7EA7
logging.level.root=info

# Elasticsearch settings
spring.data.elasticsearch.repositories.enabled=true
# localhost:9200 docker-cluster;172.16.10.190:9200 es-poc;
elasticsearch.gatewayIpPorts=localhost:9200
elasticsearch.username=
elasticsearch.password=

# NFS \u914D\u7F6E\u8DEF\u5F84
oat.data.path=${user.home}/oAT/codeData/

# Redis settings
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.database=0
spring.data.redis.repositories.enabled=false

# Monitor settings
traceNode.monitor.maxSize=200
# \u7F13\u5B58\u5BB9\u91CF
traceNode.cache.capacity=5000
# \u7F13\u5B58\u6709\u6548\u671F
traceNode.cache.validityTime=300

# \u7F3A\u9677/PRD \u81EA\u52A8\u94FE\u63A5\u6A21\u677F\uFF0C\u4F7F\u7528 {id} \u4F5C\u4E3A\u7F16\u53F7\u5360\u4F4D\u7B26
# \u793A\u4F8B\uFF1A
# oat.usecase.defect-link-template=https://jira.example.com/browse/{id}
# oat.usecase.prd-link-template=https://prd.example.com/doc/{id}
oat.usecase.defect-link-template=
oat.usecase.prd-link-template=

# AI LLM settings (LangChain4j framework)
# Enable AI LLM integration
ai.llm.enabled=true
# LLM provider: ollama, openai, deepseek, custom
ai.llm.provider=deepseek
# API base URL (for Ollama: http://localhost:11434)j
ai.llm.base-url=https://api.deepseek.com
# API Key (Ollama does not require authentication)
ai.llm.api-key=sk-c04b732edc814f4481df90564dfde892
# Model name (must support function calling/tools: qwen2.5-coder:7b, qwen2.5:7b recommended)
ai.llm.model=deepseek-v4-flash
# Max tokens for response \uFF082048, 4096\uFF0C8192\uFF09
ai.llm.max-tokens=8192
# Temperature (0-2, lower = more deterministic)
ai.llm.temperature=0.7
# Request timeout in seconds
ai.llm.timeout=300
# Log AI HTTP requests/responses (recommended false in production)
ai.llm.log-requests=false
ai.llm.log-responses=false
# System prompt prefix
ai.llm.system-prompt-prefix=\u4F60\u662F\u4E00\u4E2A\u4E13\u4E1A\u7684\u4EE3\u7801\u8986\u76D6\u7387\u5206\u6790\u52A9\u624B\uFF0C\u4E13\u6CE8\u4E8E\u5E2E\u52A9\u7528\u6237\u8FDB\u884C\u94FE\u8DEF\u5206\u6790\u3001\u95EE\u9898\u6392\u67E5\u548C\u6570\u636E\u6D1E\u5BDF\u3002

# ===== AI Enhanced Settings (v2) =====
# Semantic cache enabled (default: true)
ai.enhanced.semantic-cache.enabled=true
# Semantic cache similarity threshold (0-1, default: 0.85)
ai.enhanced.semantic-cache.threshold=0.85
# Conversation memory max rounds (default: 20)
ai.enhanced.conversation.max-rounds=20
# Self-learning enabled (default: true)
ai.enhanced.self-learning.enabled=true
# Self-learning interval hours (default: 6)
ai.enhanced.self-learning.interval-hours=6
# Reuse high-quality Q&A from feedback knowledge base (default: true)
ai.enhanced.self-learning.knowledge-hit-enabled=true
# Knowledge base similarity threshold (0-1, default: 0.7)
ai.enhanced.self-learning.knowledge-hit-threshold=0.7
# Inject dynamic learning guides into prompts (default: true)
ai.enhanced.self-learning.dynamic-guide-enabled=true
# Feedback data retention days (default: 30)
ai.enhanced.feedback.retention-days=30

# ===== AI Interactive route page context keywords =====
ai.interactive.route.coverage.keywords=\u8986\u76D6\u7387\u9875,\u9875\u9762\u7C7B\u578B:\u8986\u76D6\u7387\u9875,coverage,\u8986\u76D6\u7387\u8BE6\u60C5,\u8986\u76D6\u7387\u62A5\u544A
ai.interactive.route.trace.keywords=\u76D1\u63A7\u9875,\u9875\u9762\u7C7B\u578B:\u76D1\u63A7\u9875,\u5B9E\u65F6\u76D1\u63A7,monitor,\u8C03\u7528\u94FE\u9875,\u94FE\u8DEF\u9875
ai.interactive.route.snapshot.keywords=\u5FEB\u7167\u9875,\u9875\u9762\u7C7B\u578B:\u5FEB\u7167\u9875,snapshot,\u6211\u7684\u5FEB\u7167,\u5FEB\u7167\u5217\u8868
ai.interactive.route.app.keywords=\u5E94\u7528\u9875,\u9875\u9762\u7C7B\u578B:\u5E94\u7528\u9875,\u5E94\u7528\u4E2D\u5FC3,app/list,app/online,\u5E94\u7528\u5217\u8868,\u5728\u7EBF\u5E94\u7528
ai.interactive.route.code-relation.keywords=\u4EE3\u7801\u5173\u7CFB,\u7C7B\u5173\u7CFB,callgraph,\u5173\u7CFB\u56FE,\u8C03\u7528\u5173\u7CFB\u56FE
