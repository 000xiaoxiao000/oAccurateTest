<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<form method="POST" enctype="multipart/form-data" onsubmit="return false;">
    <input id=file type=file placeholder="select a file"/>
</form>
<pre id=log></pre>
<script src="/js/spark-md5.min.js"></script>
<script>
    var log = document.getElementById("log");
    document.getElementById("file").addEventListener("change", function () {
        var blobSlice = File.prototype.slice || File.prototype.mozSlice || File.prototype.webkitSlice,
            file = this.files[0],
            chunkSize = 2097152, // read in chunks of 2MB
            chunks = Math.ceil(file.size / chunkSize),
            currentChunk = 0,

            spark = new SparkMD5.ArrayBuffer();
        var fileReader = new FileReader();
        fileReader.onload = function (e) {
            //  log.innerHTML+="\nread chunk number "+parseInt(currentChunk+1)+" of "+chunks;
            spark.append(e.target.results); // append array buffer
            currentChunk++;
            if (currentChunk < chunks)
                loadNext();
            else
                log.innerHTML += "\n加载结束 :\n\n计算后的文件md5:\n" + spark.end();
        };
        fileReader.onerror = function () {
            log.innerHTML += "\糟糕，好像哪里错了.";
        };

        function loadNext() {
            var start = currentChunk * chunkSize,
                end = ((start + chunkSize) >= file.size) ? file.size : start + chunkSize;
            fileReader.readAsArrayBuffer(blobSlice.call(file, start, end));
        };
        loadNext();
    });
</script>

</body>
</html>
