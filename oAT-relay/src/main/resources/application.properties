server.port=18089
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.max-http-request-header-size=102400
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

logging.level.root=info
management.endpoints.web.exposure.include=health,info

oat.relay.target-base-url=http://127.0.0.1:8899
oat.relay.forward-mode=hybrid
oat.relay.connect-timeout-ms=3000
oat.relay.read-timeout-ms=10000
oat.relay.max-body-size-mb=20
oat.relay.auth-token=
oat.relay.queue.enabled=true
oat.relay.queue.capacity=10000
oat.relay.queue.workers=4
oat.relay.queue.offer-timeout-ms=100
oat.relay.queue.full-policy=sync_fallback
oat.relay.rate-limit.enabled=false
oat.relay.rate-limit.max-requests-per-second=1000
oat.relay.retry.max-attempts=5
oat.relay.retry.initial-backoff-ms=500
oat.relay.retry.max-backoff-ms=30000
